name: CLI Node CI

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cli/node/**'
      - '.github/workflows/cli-node-ci.yml'
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: cli/node
        run: pnpm run lint

      - name: Type check
        working-directory: cli/node
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: cli/node
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: cli/node
        run: pnpm run build

      - name: Verify dist output
        run: |
          test -f cli/node/dist/index.js || (echo "Build output missing: dist/index.js" && exit 1)
